name: Container build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the deployment image
        run: docker build --progress=plain -t care-rwcap:check .
      - name: Run CPU tests in the image
        run: docker run --rm care-rwcap:check python -m unittest discover -s tests -p 'test_*.py'